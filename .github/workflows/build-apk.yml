name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.13（Chaquopy 的 buildPython）
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: 装 platform 35 与 build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 把前端拷进 Python 包
        working-directory: android
        run: |
          rm -rf app/src/main/python/web
          cp -r ../web app/src/main/python/web
          ls -la app/src/main/python/web | head

      - name: assembleDebug
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 产物信息
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: doubao-cli-gui-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 打 tag 时发 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk

      - name: 构建失败时把日志留一份
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            android/**/build/reports/**
            android/build/**
          if-no-files-found: ignore
