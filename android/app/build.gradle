plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.olddriverdoge.doubaocli'
    compileSdk 35

    defaultConfig {
        applicationId 'com.olddriverdoge.doubaocli'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.1.4'

        // Chaquopy 17 的 Python 3.13 只提供 arm64-v8a / x86_64，没有 32 位
        ndk {
            abiFilters 'arm64-v8a'
        }

        python {
            version '3.13'
            pip {
                // 三个都是纯 Python 包，避开了 Android 上编译 C 扩展的坑
                install 'starlette==0.41.3'
                install 'uvicorn==0.32.1'
                install 'httpx==0.27.2'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
